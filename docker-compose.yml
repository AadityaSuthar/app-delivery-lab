services:
  backend-1:
    image: nginx:1.27
    volumes:
      - ./backend/index.html:/usr/share/nginx/html/index.template:ro
    command: /bin/sh -c "sed 's/BACKEND_NAME/backend-1/' /usr/share/nginx/html/index.template > /usr/share/nginx/html/index.html && nginx -g 'daemon off;'"
    networks: [applb]

  backend-2:
    image: nginx:1.27
    volumes:
      - ./backend/index.html:/usr/share/nginx/html/index.template:ro
    command: /bin/sh -c "sed 's/BACKEND_NAME/backend-2/' /usr/share/nginx/html/index.template > /usr/share/nginx/html/index.html && nginx -g 'daemon off;'"
    networks: [applb]

  backend-3:
    image: nginx:1.27
    volumes:
      - ./backend/index.html:/usr/share/nginx/html/index.template:ro
    command: /bin/sh -c "sed 's/BACKEND_NAME/backend-3/' /usr/share/nginx/html/index.template > /usr/share/nginx/html/index.html && nginx -g 'daemon off;'"
    networks: [applb]

  loadbalancer:
    image: nginx:1.27
    ports:
      - "8080:80"
    volumes:
      - ./configs/lb-round-robin.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on: [backend-1, backend-2, backend-3]
    networks: [applb]

networks:
  applb:
