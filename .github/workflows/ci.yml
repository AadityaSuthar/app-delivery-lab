name: Load Balancer CI

on: [push]

jobs:
  test-load-balancing:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Start the stack
        run: docker compose up -d

      - name: Wait for services
        run: sleep 10

      - name: Test distribution across backends
        run: |
          echo "Sending 30 requests with fresh connections..."
          for i in $(seq 1 30); do
            curl -s --no-keepalive "http://localhost:8080/?x=$i"
          done | grep -oE 'backend-[0-9]' | sort | uniq -c | tee /tmp/dist.txt
          DISTINCT=$(grep -oE 'backend-[0-9]' /tmp/dist.txt | sort -u | wc -l)
          echo "Distinct backends hit: $DISTINCT"
          if [ "$DISTINCT" -lt 2 ]; then
            echo "FAIL: traffic did not distribute across multiple backends"
            exit 1
          fi
          echo "PASS: traffic distributed across $DISTINCT backends"

      - name: Tear down
        if: always()
        run: docker compose down
